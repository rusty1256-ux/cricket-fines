<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cricket Fine Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 font-sans pb-10">

  <!-- PASSWORD SCREEN -->
  <div id="authContainer" class="max-w-xs mx-auto mt-20 text-center space-y-4">
    <h1 class="text-2xl font-bold text-amber-400">🏏 App Locked</h1>
    <p class="text-slate-400 text-xs">Please enter the password to access.</p>
    <input type="password" id="passwordInput" placeholder="Password" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-center text-white focus:outline-none focus:border-amber-400">
    <button onclick="checkPassword()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold p-3 rounded-xl transition shadow-md">
      Unlock
    </button>
    <p id="authError" class="text-red-400 text-xs hidden">Incorrect password.</p>
  </div>

  <!-- MAIN APP (Hidden initially) -->
  <div id="appContainer" class="hidden">
    <header class="text-center my-4">
      <h1 class="text-2xl font-bold text-amber-400">🏏 Stafford Cricket Fines</h1>
    </header>

    <main class="max-w-md mx-auto space-y-4">
      
      <!-- NAVIGATION TABS -->
      <div class="flex gap-2">
        <button id="navLog" onclick="switchView('log')" class="flex-1 bg-amber-500 text-slate-950 font-bold py-3 rounded-xl text-sm transition shadow-md">
          Log Fines
        </button>
        <button id="navLeaderboard" onclick="switchView('leaderboard')" class="flex-1 bg-slate-800 border border-amber-500/50 text-amber-400 font-bold py-3 rounded-xl text-sm transition shadow-md">
          Fine Leaderboard
        </button>
      </div>

      <!-- VIEW 1: LOGGING SECTION -->
      <div id="viewLog" class="space-y-4">
        
        <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg space-y-4">
          
          <!-- Select or Add Player -->
          <div>
            <label class="block text-xs text-slate-400 mb-1 font-medium">Select Player</label>
            <select id="playerSelect" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-400"></select>

            <div class="flex gap-2 mt-2">
              <input type="text" id="newPlayerInput" placeholder="Add new player name..." class="flex-1 bg-slate-900/80 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-400">
              <button onclick="addNewPlayer()" class="bg-slate-700 hover:bg-slate-600 text-amber-400 font-bold px-3 py-2 rounded-xl text-xs transition">
                + Add Player
              </button>
            </div>
          </div>

          <!-- Fine Selection Dropdown & Add Permanent Fine -->
          <div>
            <label class="block text-xs text-slate-400 mb-1 font-medium">Fine Reason</label>
            <select id="fineSelect" onchange="toggleCustomFine()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-400">
              <!-- Dynamically populated -->
            </select>

            <div class="flex gap-2 mt-2">
              <input type="text" id="newFineReasonInput" placeholder="Add new permanent fine option..." class="flex-1 bg-slate-900/80 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-400">
              <button onclick="addNewFineReason()" class="bg-slate-700 hover:bg-slate-600 text-amber-400 font-bold px-3 py-2 rounded-xl text-xs transition">
                + Add Fine
              </button>
            </div>
          </div>

          <!-- One-Off Custom Fine Input -->
          <div id="customFineGroup" class="hidden">
            <label class="block text-xs text-slate-400 mb-1 font-medium">One-Off Custom Fine Description</label>
            <input type="text" id="customFineInput" placeholder="e.g. Fielding like Tony" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-400">
          </div>

          <button onclick="logFine()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold p-3 rounded-xl text-sm transition active:scale-95 shadow-md">
            + Issue Fine to Player
          </button>
        </div>

        <!-- Individual Player Fine History -->
        <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg space-y-3">
          <div class="flex justify-between items-center border-b border-slate-700 pb-2">
            <h2 id="viewPlayerName" class="text-sm font-semibold uppercase tracking-wider text-amber-400">Player Fines</h2>
            <span id="viewPlayerTotal" class="bg-amber-500/20 text-amber-300 text-xs px-2.5 py-1 rounded-full font-bold">0 Fines</span>
          </div>
          <div id="fineHistory" class="space-y-2 text-xs text-slate-300 min-h-[60px]"></div>
          <button onclick="clearCurrentPlayer()" class="w-full text-red-400 text-xs text-center pt-2 hover:underline">
            Reset this player's fines
          </button>
        </div>
      </div>

      <!-- VIEW 2: INDIVIDUAL FINES LEADERBOARD -->
      <div id="viewLeaderboard" class="space-y-4 hidden">
        <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-lg mb-2 text-center">
          <h2 class="text-sm font-bold text-amber-400 uppercase tracking-wider">👑 Top Offender Per Fine</h2>
          <p class="text-xs text-slate-400 mt-1">Showing ONLY the #1 player for each specific fine.</p>
        </div>
        
        <div id="leaderboardContainer" class="space-y-3">
          <!-- Populated by JavaScript -->
        </div>
      </div>

    </main>
  </div>

  <script>
    // --- PASSWORD AUTHENTICATION ---
    function checkPassword() {
      const pwd = document.getElementById('passwordInput').value;
      if (pwd === 'password') {
        sessionStorage.setItem('cricket_auth', 'true');
        unlockApp();
      } else {
        document.getElementById('authError').classList.remove('hidden');
      }
    }

    function unlockApp() {
      document.getElementById('authContainer').classList.add('hidden');
      document.getElementById('appContainer').classList.remove('hidden');
    }

    document.getElementById('passwordInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') checkPassword();
    });

    if (sessionStorage.getItem('cricket_auth') === 'true') {
      unlockApp();
    }

    // --- DATA & STATE ---
    const initialPlayers = [
      "Ollie Peters", "Trev", "Ben", "Chris", "Kyle", "Joe (C)", 
      "James Found", "Toby", "Ali", "Zach", "Jack", "Paul", "Nithin", 
      "Dc", "Charles", "Manu", "James For", "Nikil", "Tony", "Ted", 
      "Sean", "Arnav", "Ant", "Jonny", "Dan", "Chris Dob", "Jas", "Steve"
    ];

    const initialFines = [
      "Dropped Catch", "Miss Field", "Foot Fielding", "Complaining",
      "Swearing", "Arguing at Fines", "Late", "Drinking during game",
      "Fines No Show", "Non Stafford Kit", "No Passion"
    ];

    let players = JSON.parse(localStorage.getItem('cricket_players_list')) || initialPlayers;
    let fineData = JSON.parse(localStorage.getItem('cricket_fines_data')) || {};
    let fineReasons = JSON.parse(localStorage.getItem('cricket_fine_reasons_list')) || initialFines;

    // --- NAVIGATION ---
    function switchView(view) {
      const navLog = document.getElementById('navLog');
      const navLeaderboard = document.getElementById('navLeaderboard');
      
      const viewLog = document.getElementById('viewLog');
      const viewLeaderboard = document.getElementById('viewLeaderboard');

      const inactiveStyle = "flex-1 bg-slate-800 border border-amber-500/50 text-amber-400 font-bold py-3 rounded-xl text-sm transition shadow-md";
      const activeStyle = "flex-1 bg-amber-500 text-slate-950 font-bold py-3 rounded-xl text-sm transition shadow-md";

      navLog.className = inactiveStyle;
      navLeaderboard.className = inactiveStyle;

      viewLog.classList.add('hidden');
      viewLeaderboard.classList.add('hidden');

      if (view === 'log') {
        viewLog.classList.remove('hidden');
        navLog.className = activeStyle;
        updatePlayerView();
      } else if (view === 'leaderboard') {
        viewLeaderboard.classList.remove('hidden');
        navLeaderboard.className = activeStyle;
        renderLeaderboard();
      }
    }

    // --- RENDERERS ---
    const playerSelect = document.getElementById('playerSelect');
    
    function renderPlayerDropdown() {
      const currentSelection = playerSelect.value;
      playerSelect.innerHTML = '';
      players.sort().forEach(p => {
        const option = document.createElement('option');
        option.value = p;
        option.textContent = p;
        playerSelect.appendChild(option);
      });
      if (currentSelection && players.includes(currentSelection)) {
        playerSelect.value = currentSelection;
      }
    }

    function renderFineDropdown() {
      const fineSelect = document.getElementById('fineSelect');
      const currentSelection = fineSelect.value;
      
      fineSelect.innerHTML = '<option value="">-- Choose fine --</option>';
      fineReasons.forEach(f => {
        fineSelect.innerHTML += `<option value="${f}">${f}</option>`;
      });
      fineSelect.innerHTML += '<option value="CUSTOM">✍️ One-off Custom Fine...</option>';
      
      if (currentSelection && fineReasons.includes(currentSelection)) {
        fineSelect.value = currentSelection;
      }
    }

    // --- ACTIONS ---
    function addNewPlayer() {
      const input = document.getElementById('newPlayerInput');
      const newName = input.value.trim();
      if (!newName) return;
      
      if (!players.includes(newName)) {
        players.push(newName);
        localStorage.setItem('cricket_players_list', JSON.stringify(players));
        renderPlayerDropdown();
      }
      playerSelect.value = newName;
      input.value = '';
      updatePlayerView();
    }

    function addNewFineReason() {
      const input = document.getElementById('newFineReasonInput');
      const newFine = input.value.trim();
      if (!newFine) return;
      
      if (!fineReasons.includes(newFine)) {
        fineReasons.push(newFine);
        localStorage.setItem('cricket_fine_reasons_list', JSON.stringify(fineReasons));
        renderFineDropdown();
      }
      document.getElementById('fineSelect').value = newFine;
      input.value = '';
      toggleCustomFine();
    }

    function toggleCustomFine() {
      const fineSelect = document.getElementById('fineSelect');
      const customGroup = document.getElementById('customFineGroup');
      if (fineSelect.value === 'CUSTOM') {
        customGroup.classList.remove('hidden');
      } else {
        customGroup.classList.add('hidden');
      }
    }

    playerSelect.addEventListener('change', updatePlayerView);

    function logFine() {
      const player = playerSelect.value;
      const fineSelect = document.getElementById('fineSelect');
      let fineName = fineSelect.value;

      if (fineName === 'CUSTOM') {
        const customInput = document.getElementById('customFineInput');
        fineName = customInput.value.trim();
        
        if (!fineName) {
          alert('Please enter a custom fine description.');
          return;
        }

        customInput.value = '';
        document.getElementById('customFineGroup').classList.add('hidden');
      }

      if (!fineName) {
        alert('Please select a fine.');
        return;
      }

      if (!fineData[player]) fineData[player] = {};
      fineData[player][fineName] = (fineData[player][fineName] || 0) + 1;

      localStorage.setItem('cricket_fines_data', JSON.stringify(fineData));
      fineSelect.value = ''; 
      updatePlayerView();
    }

    function updatePlayerView() {
      const player = playerSelect.value;
      const historyDiv = document.getElementById('fineHistory');
      const nameHeader = document.getElementById('viewPlayerName');
      const totalBadge = document.getElementById('viewPlayerTotal');

      if (!player) return;

      nameHeader.textContent = `${player}'s Fines`;
      const entries = Object.entries(fineData[player] || {});
      
      let grandTotal = 0;
      historyDiv.innerHTML = '';

      if (entries.length === 0) {
        historyDiv.innerHTML = '<p class="text-slate-500 italic py-2">No fines logged yet.</p>';
      } else {
        entries.forEach(([fine, count]) => {
          grandTotal += count;
          historyDiv.innerHTML += `
            <div class="flex justify-between items-center bg-slate-900/60 p-2.5 rounded-lg border border-slate-700/50">
              <span>${fine}</span>
              <span class="bg-amber-400 text-slate-950 font-bold px-2 py-0.5 rounded text-xs">${count}</span>
            </div>`;
        });
      }
      totalBadge.textContent = `${grandTotal} Total Fine${grandTotal === 1 ? '' : 's'}`;
    }

    // --- LEADERBOARD: INDIVIDUAL FINES ONLY ---
    function renderLeaderboard() {
      const container = document.getElementById('leaderboardContainer');
      container.innerHTML = '';

      // 1. Group all fine data by the Fine Name
      const fineTotalsMap = {};

      Object.entries(fineData).forEach(([player, fines]) => {
        Object.entries(fines).forEach(([fineName, count]) => {
          if (count > 0) {
            if (!fineTotalsMap[fineName]) fineTotalsMap[fineName] = [];
            fineTotalsMap[fineName].push({ player, count });
          }
        });
      });

      const fineCategories = Object.keys(fineTotalsMap);

      if (fineCategories.length === 0) {
        container.innerHTML = '<div class="bg-slate-800 p-6 rounded-xl border border-slate-700 text-center text-slate-400">No fines logged yet.</div>';
        return;
      }

      // 2. Loop through every fine type and find ONLY the #1 player
      fineCategories.sort().forEach(fineName => {
        // Sort players by who has the most of this specific fine
        const sortedList = fineTotalsMap[fineName].sort((a, b) => b.count - a.count);
        
        // Get the top score
        const maxCount = sortedList[0].count;
        
        // Find everyone tied for that #1 spot (in case two people drop exactly 5 catches)
        const topOffenders = sortedList.filter(item => item.count === maxCount);
        const playerNames = topOffenders.map(item => item.player).join(' & ');

        // Build the card UI showing ONLY the #1 offender(s)
        const card = document.createElement('div');
        card.className = "bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md flex justify-between items-center";
        
        card.innerHTML = `
          <div>
            <h3 class="text-sm font-bold text-amber-400 uppercase tracking-wider">${fineName}</h3>
            <p class="text-xs text-slate-400 mt-1">👑 <span class="font-bold text-white text-base">${playerNames}</span></p>
          </div>
          <div class="bg-amber-500/20 text-amber-300 text-lg px-4 py-2 rounded-xl font-bold border border-amber-500/30">
            ${maxCount}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function clearCurrentPlayer() {
      const player = playerSelect.value;
      if (!player) return;
      if (confirm(`Clear all fines for ${player}?`)) {
        delete fineData[player];
        localStorage.setItem('cricket_fines_data', JSON.stringify(fineData));
        updatePlayerView();
      }
    }

    // --- INITIALIZATION ---
    renderPlayerDropdown();
    renderFineDropdown();
    updatePlayerView();
  </script>
</body>
</html>
