<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cricket Fine Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 font-sans pb-10">

  <header class="text-center my-4">
    <h1 class="text-2xl font-bold text-amber-400">🏏 Stafford Cricket Fines</h1>
    <p class="text-slate-400 text-xs mt-1">Select player, fine them, done.</p>
  </header>

  <main class="max-w-md mx-auto space-y-4">
    
    <!-- NAVIGATION TABS -->
    <div class="flex bg-slate-800 rounded-xl p-1 shadow-md border border-slate-700">
      <button id="tabLogBtn" onclick="switchTab('log')" class="flex-1 py-2 rounded-lg text-sm font-bold bg-amber-500 text-slate-950 shadow transition">
        Log Fines
      </button>
      <button id="tabOverviewBtn" onclick="switchTab('overview')" class="flex-1 py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-white transition">
        Team Overview
      </button>
    </div>

    <!-- ==================== VIEW 1: LOG FINES ==================== -->
    <div id="logView" class="space-y-4">
      
      <!-- FINE ACTION FORM -->
      <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg space-y-4">
        
        <!-- 1. SELECT OR ADD PLAYER -->
        <div>
          <label class="block text-xs text-slate-400 mb-1 font-medium">Select Player</label>
          <select id="playerSelect" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-400">
            <!-- Players list loaded automatically -->
          </select>

          <!-- Add Player Row -->
          <div class="flex gap-2 mt-2">
            <input type="text" id="newPlayerInput" placeholder="Add new player name..." class="flex-1 bg-slate-900/80 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-400">
            <button onclick="addNewPlayer()" class="bg-slate-700 hover:bg-slate-600 text-amber-400 font-bold px-3 py-2 rounded-xl text-xs transition">
              + Add Player
            </button>
          </div>
        </div>

        <!-- 2. PRESET FINE DROPDOWN -->
        <div>
          <label class="block text-xs text-slate-400 mb-1 font-medium">Select Preset Fine</label>
          <select id="fineSelect" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-400">
            <option value="">-- Choose from standard fines --</option>
            <option value="Dropped Catch">Dropped Catch</option>
            <option value="Miss Field">Miss Field</option>
            <option value="Foot Fielding">Foot Fielding</option>
            <option value="Complaining">Complaining</option>
            <option value="Swearing">Swearing</option>
            <option value="Arguing at Fines">Arguing at Fines</option>
            <option value="Late">Late</option>
            <option value="Drinking during game">Drinking during game</option>
            <option value="Fines No Show">Fines No Show</option>
            <option value="Non Stafford Kit">Non Stafford Kit</option>
            <option value="No Passion">No Passion</option>
          </select>
        </div>

        <!-- 3. PERMANENT CUSTOM FINE INPUT SPOT -->
        <div>
          <label class="block text-xs text-slate-400 mb-1 font-medium">Or Type Custom Fine</label>
          <input type="text" id="customFineInput" placeholder="e.g. Fielding like Tony" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-400">
        </div>

        <button onclick="logFine()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold p-3 rounded-xl text-sm transition active:scale-95 shadow-md">
          + Add Fine
        </button>
      </div>

      <!-- PLAYER SUMMARY (CURRENT PLAYER) -->
      <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg space-y-3">
        <div class="flex justify-between items-center border-b border-slate-700 pb-2">
          <h2 id="viewPlayerName" class="text-sm font-semibold uppercase tracking-wider text-amber-400">Player Fines</h2>
          <span id="viewPlayerTotal" class="bg-amber-500/20 text-amber-300 text-xs px-2.5 py-1 rounded-full font-bold">0 Fines</span>
        </div>

        <div id="fineHistory" class="space-y-2 text-xs text-slate-300 min-h-[60px]">
          <!-- Dynamic Fine List -->
        </div>

        <button onclick="clearCurrentPlayer()" class="w-full text-red-400 text-xs text-center pt-2 hover:underline">
          Reset this player's fines
        </button>
      </div>

    </div>

    <!-- ==================== VIEW 2: TEAM OVERVIEW ==================== -->
    <div id="overviewView" class="hidden space-y-3">
      <!-- Generated via JavaScript to look like the first version -->
    </div>

  </main>

  <script>
    const initialPlayers = [
      "Ollie Peters", "Trev", "Ben", "Chris", "Kyle", "Joe (C)", 
      "James Found", "Toby", "Ali", "Zach", "Jack", "Paul", "Nithin", 
      "Dc", "Charles", "Manu", "James For", "Nikil", "Tony", "Ted", 
      "Sean", "Arnav", "Ant", "Jonny", "Dan", "Chris Dob", "Jas", "Steve"
    ];

    // Load custom players list & fine data from local storage
    let players = JSON.parse(localStorage.getItem('cricket_players_list')) || initialPlayers;
    let fineData = JSON.parse(localStorage.getItem('cricket_fines_data')) || {};

    const playerSelect = document.getElementById('playerSelect');

    // TAB SWITCHING LOGIC
    function switchTab(tab) {
      const logView = document.getElementById('logView');
      const overviewView = document.getElementById('overviewView');
      const tabLogBtn = document.getElementById('tabLogBtn');
      const tabOverviewBtn = document.getElementById('tabOverviewBtn');

      if (tab === 'log') {
        logView.classList.remove('hidden');
        overviewView.classList.add('hidden');
        
        tabLogBtn.className = "flex-1 py-2 rounded-lg text-sm font-bold bg-amber-500 text-slate-950 shadow transition";
        tabOverviewBtn.className = "flex-1 py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-white transition";
      } else {
        logView.classList.add('hidden');
        overviewView.classList.remove('hidden');
        
        tabOverviewBtn.className = "flex-1 py-2 rounded-lg text-sm font-bold bg-amber-500 text-slate-950 shadow transition";
        tabLogBtn.className = "flex-1 py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-white transition";
        
        renderOverview(); // Refresh overview data when opened
      }
    }

    function renderPlayerDropdown() {
      playerSelect.innerHTML = '';
      players.forEach(p => {
        const option = document.createElement('option');
        option.value = p;
        option.textContent = p;
        playerSelect.appendChild(option);
      });
    }

    function addNewPlayer() {
      const input = document.getElementById('newPlayerInput');
      const newName = input.value.trim();
      if (!newName) {
        alert("Please enter a player's name.");
        return;
      }
      
      if (!players.includes(newName)) {
        players.push(newName);
        localStorage.setItem('cricket_players_list', JSON.stringify(players));
        renderPlayerDropdown();
      }
      
      playerSelect.value = newName;
      input.value = '';
      updatePlayerView();
    }

    playerSelect.addEventListener('change', updatePlayerView);

    function logFine() {
      const player = playerSelect.value;
      const fineSelect = document.getElementById('fineSelect');
      const customInput = document.getElementById('customFineInput');
      
      let fineName = customInput.value.trim();

      // If custom fine text is empty, fall back to preset dropdown
      if (!fineName) {
        fineName = fineSelect.value;
      }

      if (!fineName) {
        alert('Please select a preset fine or type a custom fine.');
        return;
      }

      if (!fineData[player]) fineData[player] = {};
      fineData[player][fineName] = (fineData[player][fineName] || 0) + 1;

      // Save to localStorage
      localStorage.setItem('cricket_fines_data', JSON.stringify(fineData));
      
      // Reset inputs & update UI
      customInput.value = '';
      fineSelect.value = '';
      updatePlayerView();
    }

    function updatePlayerView() {
      const player = playerSelect.value;
      const historyDiv = document.getElementById('fineHistory');
      const nameHeader = document.getElementById('viewPlayerName');
      const totalBadge = document.getElementById('viewPlayerTotal');

      if (!player) {
        nameHeader.textContent = "No Player Selected";
        totalBadge.textContent = "0 Fines";
        historyDiv.innerHTML = '<p class="text-slate-500 italic py-2">Add or select a player to view fines.</p>';
        return;
      }

      nameHeader.textContent = `${player}'s Fines`;

      const playerFines = fineData[player] || {};
      const entries = Object.entries(playerFines);
      
      let grandTotal = 0;
      historyDiv.innerHTML = '';

      if (entries.length === 0) {
        historyDiv.innerHTML = '<p class="text-slate-500 italic py-2">No fines logged yet.</p>';
      } else {
        entries.forEach(([fine, count]) => {
          grandTotal += count;
          const row = document.createElement('div');
          row.className = 'flex justify-between items-center bg-slate-900/60 p-2.5 rounded-lg border border-slate-700/50';
          row.innerHTML = `
            <span>${fine}</span>
            <span class="bg-amber-400 text-slate-950 font-bold px-2 py-0.5 rounded text-xs">${count}</span>
          `;
          historyDiv.appendChild(row);
        });
      }

      totalBadge.textContent = `${grandTotal} Total Fine${grandTotal === 1 ? '' : 's'}`;
    }

    function clearCurrentPlayer() {
      const player = playerSelect.value;
      if (!player) return;
      if (confirm(`Clear all fines for ${player}?`)) {
        delete fineData[player];
        localStorage.setItem('cricket_fines_data', JSON.stringify(fineData));
        updatePlayerView();
      }
    }

    function renderOverview() {
      const overviewContainer = document.getElementById('overviewView');
      overviewContainer.innerHTML = '';

      // Create an array of players with their totals to sort them (Leaderboard style)
      let playerStats = players.map(p => {
        const fData = fineData[p] || {};
        const total = Object.values(fData).reduce((sum, count) => sum + count, 0);
        return { name: p, fines: fData, total: total };
      });

      // Sort by highest total fines first
      playerStats.sort((a, b) => b.total - a.total);

      playerStats.forEach(p => {
        // Skip players with 0 fines so the overview stays clean
        if (p.total === 0) return;

        const card = document.createElement('div');
        card.className = "bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md";
        
        let finesHtml = Object.entries(p.fines).map(([fine, count]) => 
          `<div class="flex justify-between items-center my-1 text-xs text-slate-300">
            <span>${fine}</span>
            <span class="bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded font-bold">${count}</span>
          </div>`
        ).join('');
        
        card.innerHTML = `
          <div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-700">
            <h2 class="text-base font-bold text-white">${p.name}</h2>
            <span class="text-xs bg-slate-900 text-amber-400 font-semibold px-3 py-1 rounded-full border border-slate-700">
              ${p.total} total
            </span>
          </div>
          <div>${finesHtml}</div>
        `;
        overviewContainer.appendChild(card);
      });

      if (overviewContainer.innerHTML === '') {
        overviewContainer.innerHTML = '<div class="text-center p-6 text-slate-500 italic bg-slate-800 rounded-xl border border-slate-700">No fines have been logged yet for the team.</div>';
      }
    }

    // Initialize UI on load
    renderPlayerDropdown();
    updatePlayerView();
  </script>
</body>
</html>
